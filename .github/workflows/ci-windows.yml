name: Build on windows

on:
  push:
    branches: [ main ]
    paths:
      - 'goldfish/**'
      - 'json/**'
      - 'library/**'
      - 'r7rs/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'xmake/**'
      - 'xmake.lua'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'goldfish/**'
      - 'json/**'
      - 'library/**'
      - 'r7rs/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'xmake/**'
      - 'xmake.lua'
      - '.github/workflows/ci-windows.yml'
  workflow_dispatch:

jobs:
  windowsbuild:
    runs-on: windows-2025
    env:
        # Force xmake to a specific folder (for cache)
        XMAKE_GLOBALDIR: ${{ github.workspace }}/.xmake-global
    steps:
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.8
      - name: update repo
        run: xmake repo -u
      - name: git crlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: config
        run: xmake config --yes -vD
      - name: build
        run: xmake build --yes -vD goldfish
      - name: test r7rs
        run: bin/gf test -j 4 r7rs/tests/
      - name: test library
        run: bin/gf test -j 4 library/tests/
      - name: test goldfish
        run: bin/gf test -j 4 goldfish/tests/
      - name: test tools/fmt
        run: bin/gf test -j 4 tools/fmt/tests
      - name: test tools/check
        run: bin/gf test -j 4 tools/check/tests
      - name: test tools/doc
        run: bin/gf test -j 4 tools/doc/tests
      - name: test tools/fix
        run: bin/gf test -j 4 tools/fix/tests
      - name: test tools/pi
        run: bin/gf test -j 4 tools/pi/tests
      - name: test tools/repl
        run: bin/gf test -j 4 tools/repl/tests

