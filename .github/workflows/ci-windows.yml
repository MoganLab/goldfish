name: Build on windows

on:
  push:
    branches: [ main ]
    paths:
      - 'goldfish/**'
      - 'json/**'
      - 'library/**'
      - 'r7rs/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'xmake/**'
      - 'xmake.lua'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'goldfish/**'
      - 'json/**'
      - 'library/**'
      - 'r7rs/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'xmake/**'
      - 'xmake.lua'
      - '.github/workflows/ci-windows.yml'
  workflow_dispatch:

jobs:
  windowsbuild:
    runs-on: windows-2025
    env:
        # Force xmake to a specific folder (for cache)
        XMAKE_GLOBALDIR: ${{ github.workspace }}/.xmake-global
    steps:
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.8
          actions-cache-folder: '.xmake-cache'
      - name: update repo
        run: xmake repo -u
      - name: git crlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cache packages from xrepo
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ runner.os }}-xrepo-${{ hashFiles('**/xmake.lua') }}

      - name: cache test results
        uses: actions/cache@v4
        with:
          path: ~/.cache/goldfish/test
          key: windows-2025-test-cache-${{ github.sha }}
          restore-keys: |
            windows-2025-test-cache-
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'src/**'
              - 'json/**'
              - 'xmake/**'
              - 'xmake.lua'
              - '.github/workflows/ci-windows.yml'
            r7rs:
              - 'r7rs/**'
            goldfish:
              - 'goldfish/**'
            library:
              - 'library/**'
            tools_shared:
              - 'tools/test/**'
              - 'tools/*.py'
            tools_fmt:
              - 'tools/fmt/**'
            tools_check:
              - 'tools/check/**'
            tools_doc:
              - 'tools/doc/**'
            tools_fix:
              - 'tools/fix/**'
            tools_pi:
              - 'tools/pi/**'
            tools_repl:
              - 'tools/repl/**'
      - name: config
        run: xmake config --yes -vD --reproducible=y
      - name: build
        run: xmake build --yes -vD goldfish
      - name: test r7rs
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true'
        run: bin/gf test r7rs/tests/
      - name: test goldfish
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true'
        run: bin/gf test goldfish/tests/
      - name: test library
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true'
        run: bin/gf test library/tests/
      - name: test tools/fmt
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true' || steps.filter.outputs.tools_shared == 'true' || steps.filter.outputs.tools_fmt == 'true'
        run: bin/gf test tools/fmt/tests
      - name: test tools/check
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true' || steps.filter.outputs.tools_shared == 'true' || steps.filter.outputs.tools_check == 'true'
        run: bin/gf test tools/check/tests
      - name: test tools/doc
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true' || steps.filter.outputs.tools_shared == 'true' || steps.filter.outputs.tools_doc == 'true'
        run: bin/gf test tools/doc/tests
      - name: test tools/fix
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true' || steps.filter.outputs.tools_shared == 'true' || steps.filter.outputs.tools_fix == 'true'
        run: bin/gf test tools/fix/tests
      - name: test tools/pi
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true' || steps.filter.outputs.tools_shared == 'true' || steps.filter.outputs.tools_pi == 'true'
        run: bin/gf test tools/pi/tests
      - name: test tools/repl
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r7rs == 'true' || steps.filter.outputs.goldfish == 'true' || steps.filter.outputs.library == 'true' || steps.filter.outputs.tools_shared == 'true' || steps.filter.outputs.tools_repl == 'true'
        run: bin/gf test tools/repl/tests

