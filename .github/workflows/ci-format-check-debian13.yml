name: Format Check on Debian 13

# 非破坏性格式化检查：构建 bin/gf 后运行 gf fmt --check，
# 一次性校验 C++（clang-format）与 Scheme（gf fmt）文件是否都已格式化。
# 扫描范围由 gf_fmt.json 决定；任一文件未格式化则退出码 1，CI 红。
# 参考自 mogan 仓库的 .github/workflows/ci-format-check-debian13.yml；
# 区别在于 goldfish 是自己构建 bin/gf（而非下载发布的 deb）。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "goldfish/**"
      - "library/**"
      - "r7rs/**"
      - "tests/**"
      - "tools/**"
      - ".clang-format"
      - "gf_fmt.json"
      - "gf_check.json"
      - "gfproject.json"
      - "xmake/**"
      - "xmake.lua"
      - ".github/workflows/ci-format-check-debian13.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "goldfish/**"
      - "library/**"
      - "r7rs/**"
      - "tests/**"
      - "tools/**"
      - ".clang-format"
      - "gf_fmt.json"
      - "gf_check.json"
      - "gfproject.json"
      - "xmake/**"
      - "xmake.lua"
      - ".github/workflows/ci-format-check-debian13.yml"
  workflow_dispatch:

env:
  XMAKE_ROOT: y
  DEBIAN_FRONTEND: noninteractive

jobs:
  format-check:
    container: debian:13
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git 7zip unzip curl build-essential pkg-config ninja-build clang-format-19

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git add safe directory
        run: git config --global --add safe.directory '*'

      - name: set XMAKE_GLOBALDIR
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> $GITHUB_ENV

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.8
          actions-cache-folder: '.xmake-cache'

      - name: xmake repo --update
        run: xmake repo --update

      - name: cache packages from xrepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ runner.os }}-xrepo-${{ hashFiles('**/xmake.lua') }}

      - name: config
        run: xmake config -vD --policies=build.ccache -o tmp/build -m releasedbg --yes
      - name: build
        run: xmake build --yes -vD goldfish

      - name: Run gf fmt --check (C++ + Scheme)
        run: bin/gf fmt --check

      - name: Run gf check (code metrics check)
        run: bin/gf check

      - name: Run gf check unit-test
        run: |
          if [ -f .git/shallow ]; then
            git fetch --unshallow origin
          else
            git fetch origin main
          fi
          # 必须以合并基点（merge-base）为比较基准：pull_request 检出的
          # HEAD 是基于检出时刻的 main 生成的合并提交，若直接用 origin/main
          # 比较，而 main 在作业运行期间又前进了，差异里会混入 main 的新提交，
          # 导致 unit-test 规则去检查与本次 PR 无关的旧测试文件而误报。
          BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo "origin/main")
          bin/gf check --only unit-test --changed-since="$BASE"
